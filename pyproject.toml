[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clustercert"
version = "0.1.0"
description = "Check that a finite graph is a periodic cluster of a lattice, for exact diagonalization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Liuke Lyu" }]
dependencies = ["numpy>=1.24", "networkx>=3.0"]

[project.optional-dependencies]
plot = ["matplotlib"]
examples = ["jupyter", "matplotlib"]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib", "nbclient", "ipykernel"]

[project.scripts]
clustercert = "clustercert.cli:main"

[tool.pytest.ini_options]
markers = ["slow: brute-force checks on larger Hilbert-space blocks (run with -m slow)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]  # zip over rows of one square matrix
